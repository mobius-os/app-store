name: Refresh package metadata

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-package-metadata
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Calculate package footprints
        run: npm run refresh-catalog
      - name: Publish changed metadata
        run: |
          if git diff --quiet -- package-metadata.json manifest-snapshots.js; then
            exit 0
          fi
          git config user.name 'mobius-app-store[bot]'
          git config user.email 'mobius-app-store[bot]@users.noreply.github.com'
          git add package-metadata.json manifest-snapshots.js
          git commit -m 'Refresh app package metadata'
          git push
